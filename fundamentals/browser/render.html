<!doctype html><html lang="en"><meta charset="utf-8"><title>Moving an element: layout vs transform · Latte Web</title><!-- latte-site:css --><link rel="stylesheet" href="../../assets/site.css"><!-- /latte-site:css -->
<!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../index.html">Latte Web</a><span class="latte-crumb">Fundamentals</span><span class="latte-links"><a href="https://github.com/L-Jovi/latte-web/tree/main/fundamentals/browser">README</a><a href="https://github.com/L-Jovi/latte-web/blob/main/fundamentals/browser/README.zh-Hans.md" lang="zh-Hans">中文</a></span></nav><!-- /latte-site:bar --><h1>Moving an element: layout vs transform</h1><p>Record a Performance trace, then compare the two buttons. A transform does not change document flow; compositor promotion is browser-dependent.</p>
<button id="layout">Move with top</button><button id="transform">Move with transform</button>
<div style="position:relative;height:250px"><div id="box" style="position:absolute;top:0;width:100px;height:100px;background:#577b95"></div></div>
<script>const box=document.querySelector('#box');document.querySelector('#layout').onclick=()=>{box.style.transform='none';box.style.top=box.style.top==='100px'?'0px':'100px'};document.querySelector('#transform').onclick=()=>{box.style.top='0px';box.style.transform=box.style.transform==='translateY(100px)'?'':'translateY(100px)'}</script></html>
