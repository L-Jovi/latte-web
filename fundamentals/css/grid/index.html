<!DOCTYPE html>
<html lang="en" data-title-en="Grid Layout" data-title-zh="Grid 布局">

<head>
  <meta charset="UTF-8">
  <title>Grid Layout</title><!-- latte-site:css --><link rel="stylesheet" href="../../../assets/site.css"><script src="../../../assets/language.js"></script><!-- /latte-site:css --><!-- latte-site:guide --><script src="../../../assets/guide.js" data-guide="../../../assets/guides/fundamentals/css/grid/index.json"></script><!-- /latte-site:guide -->

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      height: 100%;
    }

    body {
      width: 100%;
      height: 100%;
    }

    .prev {
      display: inline-block;
    }

    .next {
      display: inline-block;
    }

    .container {
      display: grid;
      width: 500px;
      height: 500px;

      grid-auto-flow: column;

      /* grid-template-rows: 100px 100px 100px; */
      /* grid-template-columns: 100px 100px 100px; */

      grid-template-rows: repeat(3, 1fr);
      grid-template-columns: repeat(1, 100px 1fr 2fr);

      /* grid-row-gap: 20px; */
      /* grid-column-gap: 20px; */

      grid-gap: 20px 15px;

      grid-template-areas: 'a . c'
                           'd . f'
                           'g . i';
    }

    .item {
      border: 1px solid #e5e4e9;
    }

    .item-1 {
      background-color: #ef342a;
    }

    .item-2 {
      background-color: #f68f26;
    }

    .item-3 {
      background-color: #4ba946;
    }

    .item-4 {
      background-color: #0376c2;
    }

    .item-5 {
      background-color: #c077af;
    }

    .item-6 {
      background-color: #f8d29d;
    }

    .item-7 {
      background-color: #b5a87f;
    }

    .item-8 {
      background-color: #d0e4a9;
    }

    .item-9 {
      background-color: #4dc7ec;
    }
  </style>
</head>

<body>
    <!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../../index.html">Latte Web</a><span class="latte-crumb"><span data-l="en">Fundamentals</span><span data-l="zh">基础</span></span><span class="latte-links"><a data-l="en" href="https://github.com/L-Jovi/latte-web/tree/main/fundamentals/css">README</a><a data-l="zh" href="https://github.com/L-Jovi/latte-web/blob/main/fundamentals/css/README.zh-Hans.md">README</a><button type="button" class="latte-language" data-language-switch hidden>中文</button></span></nav><!-- /latte-site:bar --><h1><span data-l="en">CSS layout</span><span data-l="zh">CSS 布局</span></h1>
    <p data-l="en">The guide measures the boxes for you and switches their rules on and off. You can also inspect a box in your browser’s developer tools.</p>
    <p data-l="zh">说明面板会替你测量这些盒子，并把它们的规则关掉或打开。你也可以用浏览器的开发者工具检查任意一个盒子。</p>
  <div class="prev"><span data-l="en">Previous</span><span data-l="zh">上一个</span></div>

  <div class="container">
    <div class="item item-1">1</div>
    <div class="item item-2">2</div>
    <div class="item item-3">3</div>
    <div class="item item-4">4</div>
    <div class="item item-5">5</div>
    <div class="item item-6">6</div>
    <div class="item item-7">7</div>
    <div class="item item-8">8</div>
    <div class="item item-9">9</div>
  </div>

  <div class="next"><span data-l="en">Next</span><span data-l="zh">下一个</span></div>
</body>

</html>
