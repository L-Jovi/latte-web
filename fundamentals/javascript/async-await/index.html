<!doctype html><html lang="en"><meta charset="utf-8"><title>Promise chains vs async/await · Latte Web</title><!-- latte-site:css --><link rel="stylesheet" href="../../../assets/site.css"><!-- /latte-site:css --><!-- latte-site:guide --><script src="../../../assets/guide.js" data-guide="../../../assets/guides/fundamentals/javascript/async-await/index.json"></script><!-- /latte-site:guide --><!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../../index.html">Latte Web</a><span class="latte-crumb">Fundamentals</span><span class="latte-links"><a href="https://github.com/L-Jovi/latte-web/tree/main/fundamentals/javascript/async-await">README</a><a href="https://github.com/L-Jovi/latte-web/blob/main/fundamentals/javascript/async-await/README.zh-Hans.md" lang="zh-Hans">中文</a></span></nav><!-- /latte-site:bar --><h1>Promise chains vs async/await</h1>
<p>Both functions return the same result. Await pauses this function, not the main thread.</p><output></output>
<script>function chain(){return Promise.resolve(2).then(value=>value*3)}async function withAwait(){const value=await Promise.resolve(2);return value*3}Promise.all([chain(),withAwait()]).then(results=>document.querySelector('output').textContent=results.join(' = '))</script></html>
