<body>
    <!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../../index.html">Latte Web</a><span class="latte-crumb"><span data-l="en">Fundamentals</span><span data-l="zh">基础</span></span><span class="latte-links"><a data-l="en" href="https://github.com/L-Jovi/latte-web/tree/main/fundamentals/javascript/context">README</a><a data-l="zh" href="https://github.com/L-Jovi/latte-web/blob/main/fundamentals/javascript/context/README.zh-Hans.md">README</a><button type="button" class="latte-language" data-language-switch hidden>中文</button></span></nav><!-- /latte-site:bar --><h1><span data-l="en">call, apply and bind by hand</span><span data-l="zh">手写 call、apply 与 bind</span></h1>
    <p data-l="en">The guide shows what these scripts print, one step at a time. The browser console shows the same lines.</p>
    <p data-l="zh">说明面板一步一步展示这些脚本打印的内容；浏览器控制台里是同样的几行。</p>
  <script src="./bind.js"></script>
  <script src="./call.js"></script>
  <script src="./apply.js"></script>
  <script>
    function test(a, b) {
      console.log(this.name)
      return a + b
    }

    const obj = {
      name: 'saber',
    }

    console.log(`=== forge call ===`)
    console.log(test.forgeCall(obj, 'foo', 'bar'))
    console.log(`=== forge call ===`)

    console.log('\n')

    console.log(`=== forge apply ===`)
    console.log(test.forgeApply(obj, ['foo', 'bar']))
    console.log(`=== forge apply ===`)

    console.log('\n')

    console.log(`=== forge bind ===`)
    const testBind = test.forgeBind(obj, 'foo')
    console.log(testBind('bar'))

    const foo = {
      value: 1
    }
    function bar(name, age) {
      this.habit = 'shopping';
      console.log(this.value)
      console.log(name)
      console.log(age)
    }
    bar.prototype.friend = 'kevin'
    const bindFoo = bar.bind(foo, 'daisy')
    const o = new bindFoo('18')
    console.log(o.habit)
    console.log(o.friend)
    console.log(`=== forge bind ===`)
  </script>
</body>
</html>
