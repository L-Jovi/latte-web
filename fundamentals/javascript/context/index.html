<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>call, apply and bind by hand · Latte Web</title><!-- latte-site:css --><link rel="stylesheet" href="../../../assets/site.css"><!-- /latte-site:css -->
</head>

<body>
    <!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../../index.html">Latte Web</a><span class="latte-crumb">Fundamentals</span><span class="latte-links"><a href="https://github.com/L-Jovi/latte-web/tree/main/fundamentals/javascript/context">README</a><a href="https://github.com/L-Jovi/latte-web/blob/main/fundamentals/javascript/context/README.zh-Hans.md" lang="zh-Hans">中文</a></span></nav><!-- /latte-site:bar --><h1>call, apply and bind by hand</h1>
    <p>Open the browser console to see what these scripts print.</p>
  <script src="./bind.js"></script>
  <script src="./call.js"></script>
  <script src="./apply.js"></script>
  <script>
    function test(a, b) {
      console.log(this.name)
      return a + b
    }

    const obj = {
      name: 'saber',
    }

    console.log(`=== forge call ===`)
    console.log(test.forgeCall(obj, 'foo', 'bar'))
    console.log(`=== forge call ===`)

    console.log('\n')

    console.log(`=== forge apply ===`)
    console.log(test.forgeApply(obj, ['foo', 'bar']))
    console.log(`=== forge apply ===`)

    console.log('\n')

    console.log(`=== forge bind ===`)
    const testBind = test.forgeBind(obj, 'foo')
    console.log(testBind('bar'))

    const foo = {
      value: 1
    }
    function bar(name, age) {
      this.habit = 'shopping';
      console.log(this.value)
      console.log(name)
      console.log(age)
    }
    bar.prototype.friend = 'kevin'
    const bindFoo = bar.bind(foo, 'daisy')
    const o = new bindFoo('18')
    console.log(o.habit)
    console.log(o.friend)
    console.log(`=== forge bind ===`)
  </script>
</body>
</html>
