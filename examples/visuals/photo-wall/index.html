<!doctype html>
<html lang="en" data-title-en="Photo wall with CSS transforms · Latte Web" data-title-zh="CSS transform 照片墙 · Latte Web">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Photo wall with CSS transforms · Latte Web</title
  ><!-- latte-site:css --><link rel="stylesheet" href="../../../assets/site.css"><script src="../../../assets/language.js"></script><!-- /latte-site:css --><!-- latte-site:guide --><script src="../../../assets/guide.js" data-guide="../../../assets/guides/examples/visuals/photo-wall/index.json"></script><!-- /latte-site:guide --><link rel="stylesheet" href="../style.css" />
  <!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../../index.html">Latte Web</a><span class="latte-crumb"><span data-l="en">Applications and experiments</span><span data-l="zh">应用与实验</span></span><span class="latte-links"><a data-l="en" href="https://github.com/L-Jovi/latte-web/tree/main/examples/visuals/photo-wall">README</a><a data-l="zh" href="https://github.com/L-Jovi/latte-web/blob/main/examples/visuals/photo-wall/README.zh-Hans.md">README</a><button type="button" class="latte-language" data-language-switch hidden>中文</button></span></nav><!-- /latte-site:bar --><h1><span data-l="en">Photo wall with CSS transforms</span><span data-l="zh">CSS transform 照片墙</span></h1>
  <p data-l="en">
    Each card is a small self-authored CSS landscape. Focus a card with Tab or
    hover it to see the same transform.
  </p>
  <p data-l="zh">每张卡片都是一小幅用 CSS 自己画的风景。用 Tab 键让卡片获得焦点，或者把鼠标移到它上面，都会看到同一个 transform。</p>
  <div class="wall">
    <button class="photo" style="--angle: -7deg; --hue: 0">
      <span class="landscape"></span><span data-l="en">Landscape 1</span><span data-l="zh">风景 1</span></button
    ><button class="photo" style="--angle: 4deg; --hue: 35">
      <span class="landscape"></span><span data-l="en">Landscape 2</span><span data-l="zh">风景 2</span></button
    ><button class="photo" style="--angle: 9deg; --hue: 70">
      <span class="landscape"></span><span data-l="en">Landscape 3</span><span data-l="zh">风景 3</span></button
    ><button class="photo" style="--angle: -4deg; --hue: 105">
      <span class="landscape"></span><span data-l="en">Landscape 4</span><span data-l="zh">风景 4</span></button
    ><button class="photo" style="--angle: 6deg; --hue: 140">
      <span class="landscape"></span><span data-l="en">Landscape 5</span><span data-l="zh">风景 5</span></button
    ><button class="photo" style="--angle: -8deg; --hue: 175">
      <span class="landscape"></span><span data-l="en">Landscape 6</span><span data-l="zh">风景 6</span>
    </button>
  </div>
  <style>
    .wall {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 2rem;
      padding: 2rem;
    }
    .photo {
      transform: rotate(var(--angle));
      padding: 12px;
      background: white;
      box-shadow: 2px 8px 15px #0003;
      transition: transform 0.3s;
      position: relative;
    }
    .photo:hover,
    .photo:focus-visible {
      transform: rotate(0deg) scale(1.08);
      z-index: 2;
    }
    .landscape {
      display: block;
      height: 120px;
      background:
        linear-gradient(150deg, transparent 50%, hsl(var(--hue) 30% 38%) 51%),
        linear-gradient(30deg, #86af96 48%, #dce7ec 49%);
    }
  </style>
</html>
