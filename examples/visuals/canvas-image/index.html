<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Image effects with canvas pixels · Latte Web</title
  ><!-- latte-site:css --><link rel="stylesheet" href="../../../assets/site.css"><!-- /latte-site:css --><link rel="stylesheet" href="../style.css" />
  <!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../../index.html">Latte Web</a><span class="latte-crumb">Applications and experiments</span><span class="latte-links"><a href="https://github.com/L-Jovi/latte-web/tree/main/examples/visuals/canvas-image">README</a><a href="https://github.com/L-Jovi/latte-web/blob/main/examples/visuals/canvas-image/README.zh-Hans.md" lang="zh-Hans">中文</a></span></nav><!-- /latte-site:bar --><h1>Image effects with canvas pixels</h1>
  <p>
    A self-authored SVG replaces the old photographs. Pointer coordinates are
    converted from CSS pixels to canvas pixels.
  </p>
  <label
    >Scale
    <input
      id="scale"
      type="range"
      min=".5"
      max="2"
      step=".1"
      value="1" /></label
  ><label><input id="watermark" type="checkbox" />Watermark</label
  ><label><input id="magnify" type="checkbox" />Magnifier</label>
  <div id="filters">
    <button data-mode="none">Reset</button
    ><button data-mode="grey">Grayscale</button
    ><button data-mode="threshold">Threshold</button
    ><button data-mode="invert">Invert</button
    ><button data-mode="blur">Blur</button
    ><button data-mode="mosaic">Mosaic</button
    ><button data-mode="procedural">Procedural colors</button>
  </div>
  <canvas
    width="480"
    height="300"
    tabindex="0"
    aria-label="Image canvas"
  ></canvas
  ><output>Loading</output>
  <script type="module" src="app.js"></script>
</html>
