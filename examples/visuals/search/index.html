<!doctype html>
<html lang="en" data-title-en="Search suggestions with the keyboard · Latte Web" data-title-zh="可以用键盘操作的搜索建议 · Latte Web">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Search suggestions with the keyboard · Latte Web</title
  ><!-- latte-site:css --><link rel="stylesheet" href="../../../assets/site.css"><script src="../../../assets/language.js"></script><!-- /latte-site:css --><!-- latte-site:guide --><script src="../../../assets/guide.js" data-guide="../../../assets/guides/examples/visuals/search/index.json"></script><!-- /latte-site:guide --><link rel="stylesheet" href="../style.css" />
  <!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../../index.html">Latte Web</a><span class="latte-crumb"><span data-l="en">Applications and experiments</span><span data-l="zh">应用与实验</span></span><span class="latte-links"><a data-l="en" href="https://github.com/L-Jovi/latte-web/tree/main/examples/visuals/search">README</a><a data-l="zh" href="https://github.com/L-Jovi/latte-web/blob/main/examples/visuals/search/README.zh-Hans.md">README</a><button type="button" class="latte-language" data-language-switch hidden>中文</button></span></nav><!-- /latte-site:bar --><h1><span data-l="en">Search suggestions with the keyboard</span><span data-l="zh">可以用键盘操作的搜索建议</span></h1>
  <p data-l="en">
    Type a Web topic, use Arrow keys, then Enter. Suggestions are a
    repository-owned JSON file.
  </p>
  <p data-l="zh">输入一个 Web 主题，用方向键选择，再按 Enter。建议来自仓库自带的一个 JSON 文件。</p>
  <label
    ><span data-text-en="Topic" data-text-zh="主题">Topic</span>
    <input
      id="query"
      role="combobox"
      aria-autocomplete="list"
      aria-controls="suggestions"
      aria-expanded="false"
      autocomplete="off"
  /></label>
  <ul
    id="suggestions"
    role="listbox"
    aria-label="Suggestions"
    data-label-en="Suggestions"
    data-label-zh="建议"
    hidden
  ></ul>
  <output aria-live="polite" data-text-en="Ready" data-text-zh="准备就绪"
    >Ready</output
  ><style>
    [role='option'] {
      padding: 0.4rem;
      cursor: pointer;
    }
    [aria-selected='true'] {
      background: #d5eee8;
    }
    ul {
      padding: 0;
      list-style: none;
      max-width: 25rem;
    }
  </style>
  <script type="module" src="app.js"></script>
</html>
