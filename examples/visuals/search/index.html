<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Search suggestions with the keyboard · Latte Web</title
  ><!-- latte-site:css --><link rel="stylesheet" href="../../../assets/site.css"><!-- /latte-site:css --><link rel="stylesheet" href="../style.css" />
  <!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../../index.html">Latte Web</a><span class="latte-crumb">Applications and experiments</span><span class="latte-links"><a href="https://github.com/L-Jovi/latte-web/tree/main/examples/visuals/search">README</a><a href="https://github.com/L-Jovi/latte-web/blob/main/examples/visuals/search/README.zh-Hans.md" lang="zh-Hans">中文</a></span></nav><!-- /latte-site:bar --><h1>Search suggestions with the keyboard</h1>
  <p>
    Type a Web topic, use Arrow keys, then Enter. Suggestions are a
    repository-owned JSON file.
  </p>
  <label
    >Topic
    <input
      id="query"
      role="combobox"
      aria-autocomplete="list"
      aria-controls="suggestions"
      aria-expanded="false"
      autocomplete="off"
  /></label>
  <ul id="suggestions" role="listbox" aria-label="Suggestions" hidden></ul>
  <output aria-live="polite">Ready</output
  ><style>
    [role='option'] {
      padding: 0.4rem;
      cursor: pointer;
    }
    [aria-selected='true'] {
      background: #d5eee8;
    }
    ul {
      padding: 0;
      list-style: none;
      max-width: 25rem;
    }
  </style>
  <script type="module" src="app.js"></script>
</html>
