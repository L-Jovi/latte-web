<!doctype html><html lang="en"><meta charset="utf-8"><title>How generators pause and resume · Latte Web</title><!-- latte-site:css --><link rel="stylesheet" href="../../assets/site.css"><!-- /latte-site:css --><!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../index.html">Latte Web</a><span class="latte-crumb">Build it yourself</span><span class="latte-links"><a href="https://github.com/L-Jovi/latte-web/tree/main/mechanisms/generator">README</a><a href="https://github.com/L-Jovi/latte-web/blob/main/mechanisms/generator/README.zh-Hans.md" lang="zh-Hans">中文</a></span></nav><!-- /latte-site:bar --><h1>How generators pause and resume</h1>
<p>Each next() resumes at the saved program counter. Both versions yield 1, then return 5.</p><pre></pre>
<script src="forge.js"></script><script>function* native(){const value=yield 1;return value+2}const manual=forgeGenerator(c=>{switch(c.next){case 0:c.next=1;return 1;case 1:c.stop();return c.sent+2}});const standard=native();document.querySelector('pre').textContent=JSON.stringify({native:[standard.next(),standard.next(3)],manual:[manual.next(),manual.next(3)]},null,2)</script></html>
