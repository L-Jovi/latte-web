<!doctype html><html lang="en" data-title-en="How generators pause and resume · Latte Web" data-title-zh="Generator 如何暂停与恢复 · Latte Web"><meta charset="utf-8"><title>How generators pause and resume · Latte Web</title><!-- latte-site:css --><link rel="stylesheet" href="../../assets/site.css"><script src="../../assets/language.js"></script><!-- /latte-site:css --><!-- latte-site:guide --><script src="../../assets/guide.js" data-guide="../../assets/guides/mechanisms/generator/index.json"></script><!-- /latte-site:guide --><!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../index.html">Latte Web</a><span class="latte-crumb"><span data-l="en">Build it yourself</span><span data-l="zh">动手实现</span></span><span class="latte-links"><a data-l="en" href="https://github.com/L-Jovi/latte-web/tree/main/mechanisms/generator">README</a><a data-l="zh" href="https://github.com/L-Jovi/latte-web/blob/main/mechanisms/generator/README.zh-Hans.md">README</a><button type="button" class="latte-language" data-language-switch hidden>中文</button></span></nav><!-- /latte-site:bar --><h1><span data-l="en">How generators pause and resume</span><span data-l="zh">Generator 如何暂停与恢复</span></h1>
<p data-l="en">Each next() resumes at the saved program counter. Both versions yield 1, then return 5.</p><p data-l="zh">每次调用 next() 都从保存的程序计数器处接着执行。两个版本都先 yield 出 1，再返回 5。</p><pre></pre>
<script src="forge.js"></script><script>function* native(){const value=yield 1;return value+2}const manual=forgeGenerator(c=>{switch(c.next){case 0:c.next=1;return 1;case 1:c.stop();return c.sent+2}});const standard=native();document.querySelector('pre').textContent=JSON.stringify({native:[standard.next(),standard.next(3)],manual:[manual.next(),manual.next(3)]},null,2)</script></html>
