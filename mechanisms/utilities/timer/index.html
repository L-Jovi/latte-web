<!doctype html><html lang="en"><meta charset="utf-8"><title>Why timers drift, and how to correct them · Latte Web</title><!-- latte-site:css --><link rel="stylesheet" href="../../../assets/site.css"><!-- /latte-site:css --><!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../../index.html">Latte Web</a><span class="latte-crumb">Build it yourself</span><span class="latte-links"><a href="https://github.com/L-Jovi/latte-web/tree/main/mechanisms/utilities/timer">README</a><a href="https://github.com/L-Jovi/latte-web/blob/main/mechanisms/utilities/timer/README.zh-Hans.md" lang="zh-Hans">中文</a></span></nav><!-- /latte-site:bar --><h1>Why timers drift, and how to correct them</h1>
<p>Timers can run late. This example corrects the next deadline; it cannot undo a blocked event loop.</p><button id="start">Start ten ticks</button><button id="stop">Stop</button><pre id="log"></pre>
<script src="timer-delay-fix.js"></script><script>let stop=()=>{};document.querySelector('#start').onclick=()=>{stop();document.querySelector('#log').textContent='';stop=startDriftTimer(({count,drift})=>{document.querySelector('#log').textContent+=`${count}: ${drift.toFixed(2)} ms late\n`;if(count===10)stop()},100)};document.querySelector('#stop').onclick=()=>stop()</script></html>
