<!doctype html><html lang="en" data-title-en="Why timers drift, and how to correct them · Latte Web" data-title-zh="定时器为什么会漂移，以及如何校正 · Latte Web"><meta charset="utf-8"><title>Why timers drift, and how to correct them · Latte Web</title><!-- latte-site:css --><link rel="stylesheet" href="../../../assets/site.css"><script src="../../../assets/language.js"></script><!-- /latte-site:css --><!-- latte-site:guide --><script src="../../../assets/guide.js" data-guide="../../../assets/guides/mechanisms/utilities/timer/index.json"></script><!-- /latte-site:guide --><!-- latte-site:bar --><nav class="latte-bar" aria-label="Latte Web"><a class="latte-home" href="../../../index.html">Latte Web</a><span class="latte-crumb"><span data-l="en">Build it yourself</span><span data-l="zh">动手实现</span></span><span class="latte-links"><a data-l="en" href="https://github.com/L-Jovi/latte-web/tree/main/mechanisms/utilities/timer">README</a><a data-l="zh" href="https://github.com/L-Jovi/latte-web/blob/main/mechanisms/utilities/timer/README.zh-Hans.md">README</a><button type="button" class="latte-language" data-language-switch hidden>中文</button></span></nav><!-- /latte-site:bar --><h1><span data-l="en">Why timers drift, and how to correct them</span><span data-l="zh">定时器为什么会漂移，以及如何校正</span></h1>
<p data-l="en">Timers can run late. This example corrects the next deadline; it cannot undo a blocked event loop.</p><p data-l="zh">定时器可能会晚到。这个例子会校正下一次的触发时间，但无法挽回被阻塞的事件循环。</p><button id="start" data-text-en="Start ten ticks" data-text-zh="开始十次计时">Start ten ticks</button><button id="stop" data-text-en="Stop" data-text-zh="停止">Stop</button><pre id="log"></pre>
<script src="timer-delay-fix.js"></script><script>let stop=()=>{};document.querySelector('#start').onclick=()=>{stop();document.querySelector('#log').textContent='';stop=startDriftTimer(({count,drift})=>{document.querySelector('#log').textContent+=`${count}: ${drift.toFixed(2)} ms late\n`;if(count===10)stop()},100)};document.querySelector('#stop').onclick=()=>stop()</script></html>
