<!doctype html><html lang="en"><meta charset="utf-8"><title>Why timers drift, and how to correct them · Latte Web</title><h1>Why timers drift, and how to correct them</h1>
<p>Timers can run late. This example corrects the next deadline; it cannot undo a blocked event loop.</p><button id="start">Start ten ticks</button><button id="stop">Stop</button><pre id="log"></pre>
<script src="timer-delay-fix.js"></script><script>let stop=()=>{};document.querySelector('#start').onclick=()=>{stop();document.querySelector('#log').textContent='';stop=startDriftTimer(({count,drift})=>{document.querySelector('#log').textContent+=`${count}: ${drift.toFixed(2)} ms late\n`;if(count===10)stop()},100)};document.querySelector('#stop').onclick=()=>stop()</script></html>
